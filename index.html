<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Vanessa's Christmas List</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root{--bg:#fffaf1;--surface:#fffdf9;--fg:#14271f;--muted:#5b6f66;--line:#e8dccb;--accent:#b3262f;--pine:#1f5240;--good:#1f6b49;--good-bg:#dcefe4;font-family:"DM Sans",system-ui,sans-serif;color:var(--fg);background:var(--bg)}*{box-sizing:border-box}body{margin:0;padding:2rem 1rem 4rem;line-height:1.45}.wrap{max-width:760px;margin:auto}header{padding:1.6rem 1.5rem;margin-bottom:1.25rem;background:#1f5240;color:#fff;border-radius:16px;box-shadow:0 8px 24px rgba(20,39,31,.12)}.eyebrow{font-size:.75rem;letter-spacing:.14em;text-transform:uppercase;color:#f2a1a8;font-weight:600}h1,h2{font-family:"Bricolage Grotesque",system-ui,sans-serif}h1{font-size:clamp(2.2rem,8vw,3.6rem);line-height:1;margin:.5rem 0;letter-spacing:-.03em}.lede{color:#e5f0e9;max-width:52ch}.howto{display:flex;gap:.5rem 1.25rem;flex-wrap:wrap;font-size:.875rem;color:#d6e6dc;margin-top:1rem}.bar{position:sticky;top:0;z-index:2;background:var(--bg);padding:.75rem 0;border-block:1px solid var(--line);display:flex;align-items:center;gap:.75rem}.chips{display:flex;gap:.4rem;flex-wrap:wrap;flex:1}.chip,.btn{font:inherit;cursor:pointer;border:1px solid var(--line);background:var(--surface);color:var(--fg);padding:.4rem .75rem;border-radius:6px;font-size:.85rem;font-weight:500;text-decoration:none}.snowflake{width:2.4rem;height:2.4rem;padding:0;border-radius:999px;font-size:1.25rem;line-height:1;display:inline-grid;place-items:center;background:#f4e8f6;border-color:#d8bfdc;transition:transform .15s ease,background .15s ease}.snowflake:hover{background:#ead7ef;transform:rotate(18deg) scale(1.08)}.falling-snowflake{position:fixed;top:-2rem;z-index:20;pointer-events:none;color:#c9deef;text-shadow:0 1px 4px #fff;font-size:1.15rem;animation:snowfall 3.3s linear forwards}@keyframes snowfall{to{transform:translate(var(--drift),110vh) rotate(360deg);opacity:0}}.chip{border-radius:999px}.chip[aria-pressed="true"]{background:var(--pine);border-color:var(--pine);color:#fff}.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}.btn:disabled{opacity:.55;cursor:not-allowed}.status{font-size:.875rem;color:var(--muted);min-height:1.3em;margin:.75rem 0}section{margin-top:2rem}h2{font-size:1.35rem;margin:0 0 .75rem;display:flex;gap:.6rem;align-items:center}.dot{width:.7rem;height:.7rem;border-radius:50%;background:var(--cat)}.count{font-family:"DM Sans",sans-serif;font-size:.8rem;color:var(--muted);font-weight:400}ul{list-style:none;margin:0;padding:0;display:grid;gap:.6rem}.item{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:.85rem;display:grid;grid-template-columns:3rem minmax(0,1fr) auto;gap:.85rem;align-items:center}.item.claimed{background:transparent}.tile{width:3rem;height:3rem;border-radius:8px;background:var(--cat);color:#fff;display:grid;place-items:center;font-family:"Bricolage Grotesque",sans-serif;font-weight:800}.brand{font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:600}.name{font-weight:600;overflow-wrap:anywhere}.meta{display:flex;flex-wrap:wrap;gap:.3rem;margin-top:.35rem}.tag{font-size:.75rem;border:1px solid var(--line);border-radius:4px;padding:.05rem .4rem;color:var(--muted)}.side{display:grid;gap:.45rem;justify-items:end;text-align:right}.actions{display:flex;gap:.4rem;flex-wrap:wrap;justify-content:end}.claimed-note{font-size:.8rem;color:var(--good);background:var(--good-bg);padding:.2rem .55rem;border-radius:4px;font-weight:500}.claimform{grid-column:1/-1;display:flex;gap:.5rem;flex-wrap:wrap;border-top:1px dashed var(--line);padding-top:.75rem}.claimform input{font:inherit;padding:.4rem .6rem;border:1px solid var(--line);border-radius:6px;min-width:10rem;flex:1}.hint,.err{font-size:.8rem;flex-basis:100%;color:var(--muted)}.err{color:var(--accent)}footer{margin-top:2.5rem;color:var(--muted);font-size:.85rem}@media(max-width:560px){.item{grid-template-columns:3rem 1fr}.side{grid-column:1/-1;justify-items:start;text-align:left}.actions{justify-content:start}}
  </style>
</head>
<body>
<div class="wrap">
  <header>
    
    <h1>Vanessa's 2026 Christmas Wishlist</h1><button class="btn snowflake" id="snowflake" type="button" aria-label="Make it snow" title="Make it snow">❄</button>
    <p class="lede">Ideas for anyone who asked. Tap “I’ll get this” to avoid doubling up. Sizes and colors are listed on each item.</p>
    <div class="howto"><span>1. Open the link to see the item</span><span>2. Tap “I’ll get this”</span><span>3. Add your name</span></div>
  </header>
  <div class="bar"><div class="chips" id="chips"></div><label><input type="checkbox" id="hideClaimed"> Hide claimed</label></div>
  <p class="status" id="status" role="status">Loading the list…</p>
  <main id="list"></main>
  <footer>Claims save for everyone who opens this page.</footer>
</div>
<script>
// I will add the Google Sheet web-app address here once it is created.
const API_URL = "https://script.google.com/macros/s/AKfycbxy95QPgvKvFUig784nzA2t9AvvbPKblypZYADiGt9ET68PO6lsitQuialCbsVe3snyTw/exec";
const ITEMS = [
["yoga-towel","studio","lululemon","Yoga Mat Towel with Grip",["Black"],"$64","https://shop.lululemon.com/p/yoga-mat-towel-grip/ogch4mjrp8?color=0001"],["yoga-bag","studio","lululemon","Adjustable Yoga Mat Bag",["Black"],"$68","https://shop.lululemon.com/p/adjustable-yoga-mat-bag/eogyiznq7r?color=0001"],["fp-tank","studio","FP Movement","Logo Tank",["White","M/L"],"$38","https://www.freepeople.com/fpmovement/shop/fp-movement-logo-tank/?color=010&size=M/L&type=REGULAR&quantity=1"],["fp-fleece","studio","FP Movement","Mountain High Half-Zip Fleece",["Electric Cherry With Pearl","S"],"$98","https://www.freepeople.com/fpmovement/shop/mountain-high-half-zip-fleece/?color=258&size=S&type=REGULAR&quantity=1"],["fp-pants","studio","FP Movement","Take It Easy Pants",["Mars","S or M"],"$78","https://www.freepeople.com/fpmovement/shop/take-it-easy-pants/?color=051&size=S&type=REGULAR&quantity=1"],["fp-socks","studio","FP Movement","Classic Ruffle Sock 2-Pack",["Grey / White"],"$28","https://www.freepeople.com/fpmovement/shop/classic-ruffle-sock-2-pack/?color=006&size=One+Size&type=REGULAR&quantity=1"],["fp-cami","studio","FP Movement","Go To Smooth Square Neck Cami",["Washed Ice Grey","M/L"],"$48","https://www.freepeople.com/fpmovement/shop/go-to-smooth-square-neck-cami/?color=040&size=M/L&type=REGULAR&quantity=1"],
["asics-white","shoes","Asics","GEL-1130 Sneakers",["White / Clay Canyon","Size 7"],"","https://www.anthropologie.com/shop/asics-gel-1130-sneakers2?color=879&type=STANDARD&quantity=1&size=7W+/+5.5M"],["asics-cream","shoes","Asics","GEL-1130 Sneakers",["Cream / Pink Cloud","Size 7"],"","https://www.anthropologie.com/shop/asics-gel-1130-sneakers2?color=014&type=STANDARD&quantity=1&size=7W+/+5.5M"],
["sony-xm5","tech","Sony","WH-1000XM5 Wireless Noise Cancelling Headphones",["Silver"],"","https://www.bestbuy.com/product/sony-wh-1000xm5-wireless-noise-cancelling-over-the-ear-headphones-silver/J7XSRH5CXV"],["casely-plum","tech","Casely","On the Dot iPhone 17 Pro Case",["Plum polka dot","iPhone 17 Pro"],"","https://www.getcasely.com/collections/iphone-17-pro-cases/products/on-the-dot-plum-polka-dot-case?variant=43942452625511"],["casely-olive","tech","Casely","Olive Stripes iPhone 17 Pro Case",["Layered lines","iPhone 17 Pro"],"","https://www.getcasely.com/collections/iphone-17-pro-cases/products/olive-stripes-layered-lines-case?variant=50394337575015"],
["pure-trio","beauty","Innersense","Pure Trio",[],"$84","https://innersensebeauty.com/collections/clean-hair-care-kits/products/pure-trio"],["vb-iron","beauty","Vera Bradley","Ultralight Curling & Flat Iron Cover",[],"","https://www.target.com/p/vera-bradley-women-s-outlet-ultralight-curling-flat-iron-cover/-/A-93335965?preselect=93335967"],
["nespresso-vaniglia","coffee","Nespresso","Vaniglia Coffee Pods",["Original line"],"","https://www.nespresso.com/us/en/order/capsules/original/vaniglia-coffee-pods"],["nespresso-athens","coffee","Nespresso","Athens Freddo Intenso Pods",["Original line"],"","https://www.nespresso.com/us/en/order/capsules/original/athens-freddo-intenso"],["espresso-ball","coffee","Amazon","Stainless Steel Espresso Chilling Ball",["For cold espresso"],"","https://www.amazon.com/dp/B0D3FWHPCG?th=1"],
["alex-pant","alex","Abercrombie","Lounge Pant",["S or M","Short"],"","https://www.abercrombie.com/shop/us/p/lounge-pant-63889319?categoryId=161767"],["alex-tee","alex","Abercrombie","Long-Sleeve Lounge Tee",["M"],"","https://www.abercrombie.com/shop/us/p/long-sleeve-lounge-tee-63863819?categoryId=161767"]
].map(([id,cat,brand,name,tags,price,url])=>({id,cat,brand,name,tags,price,url}));
const CATS={studio:["Movement","#2f6b54"],shoes:["Shoes","#b3263b"],tech:["Tech","#2f6b54"],beauty:["Hair & Beauty","#b3263b"],coffee:["Coffee","#2f6b54"],alex:["For Alex","#b3263b"]};
let claims={},filter="all",hide=false,open=null;
const $=s=>document.querySelector(s),mono=b=>b.split(/\s+/).map(x=>x[0]).join("").slice(0,2).toUpperCase();
function esc(s){const d=document.createElement("div");d.textContent=s;return d.innerHTML}
function render(){const root=$("#list");root.innerHTML="";for(const [key,[label,color]] of Object.entries(CATS)){if(filter!=="all"&&filter!==key)continue;const group=ITEMS.filter(x=>x.cat===key&&!(hide&&claims[x.id]));if(!group.length)continue;const sec=document.createElement("section");sec.style.setProperty("--cat",color);sec.innerHTML='<h2><span class="dot"></span>'+label+' <span class="count">'+group.length+' items</span></h2><ul></ul>';const ul=sec.querySelector("ul");for(const x of group){const claim=claims[x.id],li=document.createElement("li");li.className="item"+(claim?" claimed":"");li.innerHTML='<div class="tile">'+mono(x.brand)+'</div><div><div class="brand">'+esc(x.brand)+'</div><div class="name">'+esc(x.name)+'</div><div class="meta">'+x.tags.map(t=>'<span class="tag">'+esc(t)+'</span>').join("")+'</div></div><div class="side">'+(claim?'<div class="claimed-note">Claimed by '+esc(claim)+'</div>':"")+'<div class="actions"><a class="btn" href="'+x.url+'" target="_blank" rel="noopener">View item</a>'+(claim?"" :'<button class="btn primary" '+(!API_URL?"disabled":"")+'>I’ll get this</button>')+'</div></div>';if(!claim&&API_URL)li.querySelector("button").onclick=()=>{open=x.id;render()};if(open===x.id){const form=document.createElement("form");form.className="claimform";form.innerHTML='<input required maxlength="40" placeholder="Your name" aria-label="Your name"><button class="btn primary">Confirm</button><button class="btn" type="button">Cancel</button><span class="hint">Your name shows next to the item so others know it’s covered.</span>';form.querySelector('[type="button"]').onclick=()=>{open=null;render()};form.onsubmit=async e=>{e.preventDefault();const name=form.querySelector("input").value.trim();try{const r=await fetch(API_URL,{method:"POST",body:new URLSearchParams({id:x.id,name})});const result=await r.json();if(!result.ok)throw Error();open=null;await load()}catch{form.insertAdjacentHTML("beforeend",'<span class="err">This item may have just been claimed. Refresh and try another.</span>')}};li.append(form)}ul.append(li)}root.append(sec)}}
function chips(){const box=$("#chips");box.innerHTML="";for(const [key,label] of [["all","All"],...Object.entries(CATS).map(([k,v])=>[k,v[0]])]){const b=document.createElement("button");b.className="chip";b.textContent=label;b.setAttribute("aria-pressed",filter===key);b.onclick=()=>{filter=key;chips();render()};box.append(b)}}
async function load(){if(!API_URL){$("#status").textContent="Claims will turn on once the shared sheet is connected.";render();return}try{const r=await fetch(API_URL+"?t="+Date.now());claims=await r.json();$("#status").textContent=Object.keys(claims).length+" of "+ITEMS.length+" items claimed"}catch{$("#status").textContent="Claims are temporarily unavailable. Please try again shortly."}render()}
const snowButton=$("#snowflake");if(snowButton)snowButton.onclick=()=>{for(let i=0;i<26;i++){const flake=document.createElement("span");flake.className="falling-snowflake";flake.textContent="❄";flake.style.left=(Math.random()*100)+"vw";flake.style.setProperty("--drift",((Math.random()-.5)*180)+"px");flake.style.animationDelay=(Math.random()*.55)+"s";flake.style.fontSize=(.7+Math.random()*1.1)+"rem";document.body.append(flake);setTimeout(()=>flake.remove(),4000)}};$("#hideClaimed").onchange=e=>{hide=e.target.checked;render()};chips();load();
</script></body></html>
